services:
  app:
    build: .
    ports:
      - "2222:22"     # SSH  →  ssh -p 2222 pika@localhost  (password: pika)
      - "3000:3000"   # Express API
      - "5173:5173"   # Vite dev server  →  http://localhost:5173
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/inspector_pika
      PORT: "3000"
    env_file:
      # .env values override the DATABASE_URL above — set GITHUB_TOKEN here
      - path: .env
        required: false
    volumes:
      - app_data:/app/data    # cloned repos + analysis output
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inspector_pika
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app_data:
  pg_data:
